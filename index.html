<style>
  :root{
    --bg:#1c1815;
    --surface:#26211d;

    --text:#f2ece2;
    --muted:#a89a89;
    --accent:#c6553c;
    --accent-2:#d4a24c;
    --good:#7fa06f;
    --danger:#c65050;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:480px;margin:0 auto;padding:18px 16px 60px;min-height:100vh;}
  h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  h2{font-size:16px;margin:0 0 10px;font-weight:700;color:var(--accent-2);}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:75vh;}
  input, select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:#ffffff;
    -webkit-text-fill-color:#ffffff;
    padding:13px 14px;border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit;
    caret-color:#ffffff;
  }
  input::placeholder{color:var(--muted);opacity:1;-webkit-text-fill-color:var(--muted);}
  input:-webkit-autofill{-webkit-text-fill-color:#ffffff !important;box-shadow:0 0 0px 1000px var(--surface-2) inset !important;}
  input:focus, select:focus{outline:none;border-color:var(--accent);}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  button{
    padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .btn-primary{width:100%;background:var(--accent);color:#fff;}
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{width:100%;background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-role{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);text-align:start;padding:18px;margin-bottom:10px;}
  .btn-role b{display:block;font-size:17px;margin-bottom:4px;color:var(--text);}
  .btn-role span{color:var(--muted);font-size:12.5px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface-2);width:auto;padding:0;}
  .lang-toggle button{padding:7px 12px;font-size:12px;border-radius:0;background:transparent;color:var(--muted);width:auto;font-weight:700;}
  .lang-toggle button.active{background:var(--accent);color:#fff;}
  .logout{color:var(--muted);font-size:13px;background:none;border:none;width:auto;padding:6px;text-decoration:underline;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-name{font-weight:600;font-size:15px;}
  .item-meta{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .qty-badge{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--surface-2);white-space:nowrap;}
  .qty-low{color:var(--danger);}
  .qty-ok{color:var(--good);}
  .tag{font-size:10.5px;color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:2px 6px;margin-inline-start:6px;}
  .grid-units{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px;}
  .unit-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 4px;text-align:center;font-size:13px;cursor:pointer;color:#ffffff;}
  .unit-btn.sold{opacity:0.35;text-decoration:line-through;}
  .unit-btn b{display:block;font-size:16px;margin-bottom:2px;color:#ffffff;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:11px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .log-entry{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .log-entry:last-child{border-bottom:none;}
  .log-meta{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13.5px;}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px;}
  .msg-error{background:rgba(198,80,80,0.15);color:#e08a8a;border:1px solid rgba(198,80,80,0.35);}
  .msg-success{background:rgba(127,160,111,0.15);color:#a8cf9a;border:1px solid rgba(127,160,111,0.35);}
  .fine{color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.7;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:auto;padding:7px 12px;font-size:12px;border-radius:8px;}
  .stepper{display:flex;align-items:stretch;gap:6px;margin-top:8px;}
  .stepper input{margin-bottom:0;text-align:center;}
  .step-btn{width:46px;flex:0 0 46px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:20px;font-weight:700;padding:0;line-height:1;}
  .go-btn{flex:0 0 auto;padding:0 16px;}
</style>

// ---------- SUPABASE DATA LAYER ----------
function itemToRow(item){
  return {
    id: item.id,
    name: item.name || null,
    name_en: item.nameEn || null,
    track_type: item.trackType,
    unit_label: item.unitLabel || null,
    unit_label_en: item.unitLabelEn || null,
    qty: (item.qty !== undefined && item.qty !== null) ? item.qty : 0,
    low_stock: item.lowStock || 0,
    units: item.units || []
  };
}
function rowToItem(row){
  const item = { id: row.id, name: row.name, nameEn: row.name_en, trackType: row.track_type, lowStock: row.low_stock };
  if(row.track_type === 'numbered_weight'){
    item.units = row.units || [];
  } else {
    item.qty = row.qty;
    item.unitLabel = row.unit_label;
    item.unitLabelEn = row.unit_label_en;
  }
  return item;
}
function logToRow(l){
  return {
    id: l.id, item_id: l.itemId, item_name: l.itemName, item_name_en: l.itemNameEn || null,
    type: l.type, qty: l.qty, unit: l.unit,
    unit_num: (l.unitNum !== undefined && l.unitNum !== null) ? l.unitNum : null,
    user_name: l.user, time_label: l.timeLabel, raw_date: l.rawDate
  };
}
function rowToLog(row){
  return {
    id: row.id, itemId: row.item_id, itemName: row.item_name, itemNameEn: row.item_name_en,
    type: row.type, qty: row.qty, unit: row.unit, unitNum: row.unit_num,
    user: row.user_name, timeLabel: row.time_label, rawDate: row.raw_date
  };
}
async function itemsGetAll(){
  try{
    const { data, error } = await supabase.from('items').select('*');
    if(error || !data) return null;
    return data.map(rowToItem);
  }catch(e){ return null; }
}
async function logsGetAll(){
  try{
    const { data, error } = await supabase.from('logs').select('*').order('created_at', { ascending:false });
    if(error || !data) return null;
    return data.map(rowToLog);
  }catch(e){ return null; }
}
async function settingsGet(key){
  try{
    const { data, error } = await supabase.from('settings').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function settingsSet(key, value){
  try{
    await supabase.from('settings').upsert({ key, value });
    return true;
  }catch(e){ return false; }
}

async function init(){
  const savedLang = localStorage.getItem('tanourko-lang-pref');
  if(savedLang) lang = savedLang;
  applyDocDirection();

  let items = await itemsGetAll();
  if(!items || items.length===0){
    items = seedDefaults();
    try{ await supabase.from('items').insert(items.map(itemToRow)); }catch(e){}
  }
  let logs = await logsGetAll();
  if(!logs) logs = [];
  let users = await settingsGet('users');
  if(!users){
    users = [{ username:'tanourko', password:'1234' }];
    await settingsSet('users', users);

function fmt(n){ return (Math.round(n*100)/100).toString(); }
function nowStr(){
  const d = new Date();
  return d.toLocaleString(lang==='en' ? 'en-GB' : 'ar-EG', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' });
}

async function setLang(newLang){
  lang = newLang;
  applyDocDirection();
  try{ localStorage.setItem('tanourko-lang-pref', newLang); }catch(e){}
  render();
}

async function addLog(entry){
  entry.id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
  entry.timeLabel = nowStr();
  entry.rawDate = new Date().toISOString().slice(0,10);
  state.logs.unshift(entry);
  try{ await supabase.from('logs').insert(logToRow(entry)); }catch(e){}
}

function logLineText(l){
  const nm = l.itemNameEn && lang==='en' ? l.itemNameEn : l.itemName;
  let label = '';
  if(l.type==='consume') label = `${t('consumeType')} ${fmt(l.qty)} ${l.unit}`;
  if(l.type==='consume-unit') label = `${t('consumeUnitType')} ${l.unitNum}: ${fmt(l.qty)} ${t('kg')}`;
  if(l.type==='sell-unit') label = `${t('sellUnitType')} ${l.unitNum} (${fmt(l.qty)} ${t('kg')})`;
  if(l.type==='restock') label = `${t('restockType')}: ${fmt(l.qty)} ${l.unit}`;
  return `- ${nm}: ${label} (${l.timeLabel} - ${l.user})`;
}

function buildDailySummaryText(){
  const today = new Date().toISOString().slice(0,10);
  const todays = state.logs.filter(l=>l.rawDate===today);
  if(todays.length===0){
    return `${t('reportTitle')} - ${nowStr()}\n\n${t('noActivityToday')}`;
  }
  const lines = todays.slice().reverse().map(logLineText).join('\n');
  return `${t('reportTitle')} - ${nowStr()}\n\n${lines}`;
}

async function saveItems(){ try{ await supabase.from('items').upsert(state.items.map(itemToRow)); }catch(e){} }
function getItem(id){ return state.items.find(i=>i.id===id); }
function isLow(item){
  if(item.trackType === 'numbered_weight'){
    return item.units.filter(u=>!u.sold).length <= item.lowStock;
  }
  return item.qty <= item.lowStock;
}

// ---------- ACTIONS ----------
async function cookConsumeSimple(itemId, amount, who){
  const item = getItem(itemId);
  if(!item || amount<=0) return;
  item.qty = Math.max(0, item.qty - amount);
  await saveItems();
  await addLog({ type:'consume', itemId, itemName:item.name, itemNameEn:item.nameEn, qty:amount, unit:itemUnitLabel(item), user:who });
  state.message = { type:'success', text: `${t('consumeLogged')} ${fmt(amount)} ${itemUnitLabel(item)} ${t('fromItem')} ${itemName(item)}` };
  render();
}
async function cookConsumeUnitPartial(itemId, unitNum, kgUsed, who){
  const item = getItem(itemId);
  const unit = item.units.find(u=>u.num===unitNum);
  if(!unit || unit.sold) return;
  const used = Math.min(unit.remaining, kgUsed);
  unit.remaining = Math.max(0, unit.remaining - used);
  await saveItems();
  await addLog({ type:'consume-unit', itemId, itemName:item.name, itemNameEn:item.nameEn, unitNum, qty:used, unit:t('kg'), user:who });
  state.message = { type:'success', text:`${t('consumeLogged')} ${fmt(used)} ${t('kg')} ${t('fromItem')} ${itemName(item)} ${t('unitNumber')}${unitNum}` };
  render();
}
async function cookSellUnitFull(itemId, unitNum, who){
  const item = getItem(itemId);
  const unit = item.units.find(u=>u.num===unitNum);
  if(!unit || unit.sold) return;
  unit.sold = true;
  const soldWeight = unit.remaining;
  unit.remaining = 0;
  await saveItems();
  await addLog({ type:'sell-unit', itemId, itemName:item.name, itemNameEn:item.nameEn, unitNum, qty:soldWeight, unit:t('kg')+' ('+t('fully')+')', user:who });
  state.message = { type:'success', text:`${t('soldFull')} ${itemName(item)} ${t('unitNumber')}${unitNum} ${t('fully')}` };
  render();
}
async function adminAddStock(itemId, amount){
  const item = getItem(itemId);
  if(!item) return;
  if(item.trackType === 'numbered_weight'){
    const nextNum = item.units.length ? Math.max(...item.units.map(u=>u.num))+1 : 1;
    item.units.push({num: nextNum, initial: amount, remaining: amount, sold:false});
  } else {
    item.qty += amount;
  }
  await saveItems();
  await addLog({ type:'restock', itemId, itemName:item.name, itemNameEn:item.nameEn, qty:amount, unit: itemUnitLabel(item)||'', user: lang==='en'?'Admin':'الإدارة' });
  state.message = { type:'success', text:`${t('restockAdded')} ${itemName(item)}: ${fmt(amount)}` };
  render();
}
async function adminAddNewItem(data){
  const id = 'item-' + Date.now();
  const item = { id, name:data.name, nameEn:data.name, trackType:data.trackType, lowStock:data.lowStock||0 };
  if(data.trackType==='numbered_weight'){ item.units = []; }
  else { item.qty = data.qty||0; item.unitLabel = data.unitLabel||'وحدة'; item.unitLabelEn = data.unitLabel||'unit'; }
  state.items.push(item);
  await saveItems();
  state.message = { type:'success', text:`${t('itemAdded')}: ${data.name}` };
  render();
}
async function adminDeleteItem(itemId){
  state.items = state.items.filter(i=>i.id!==itemId);
  try{ await supabase.from('items').delete().eq('id', itemId); }catch(e){}
  render();
}

function messageBox(){

function langToggleHtml(){

      <button data-lang="en" class="${lang==='en'?'active':''}">EN</button>
    </div>
  `;
}
function bindLangToggle(container){
  container.querySelectorAll('.lang-toggle [data-lang]').forEach(b=>{
    b.onclick = ()=> setLang(b.dataset.lang);
  });
}
// stepper input builder: returns a wrapper element with -, input, + and a go button
function buildStepper(id, step, placeholder, goLabel, onGo){
  const wrap = document.createElement('div');
  wrap.className = 'stepper';
  wrap.innerHTML = `
    <button type="button" class="step-btn" id="${id}-minus">−</button>
    <input type="number" min="0" step="any" id="${id}-input" placeholder="${placeholder}">
    <button type="button" class="step-btn" id="${id}-plus">+</button>
    <button type="button" class="btn-primary go-btn" id="${id}-go">${goLabel}</button>
  `;
  const input = wrap.querySelector(`#${id}-input`);
  wrap.querySelector(`#${id}-minus`).onclick = ()=>{
    const v = Math.max(0, (parseFloat(input.value)||0) - step);
    input.value = fmt(v);
  };
  wrap.querySelector(`#${id}-plus`).onclick = ()=>{
    const v = (parseFloat(input.value)||0) + step;
    input.value = fmt(v);
  };
  wrap.querySelector(`#${id}-go`).onclick = ()=>{
    const v = parseFloat(input.value);
    if(!isNaN(v) && v>0) onGo(v);
  };
  return wrap;
}

      adminAddNewItem({ name, trackType:type, lowStock: low });
    } else {
      const unitLabel = card.querySelector('#new-unit').value.trim() || (lang==='en'?'unit':'وحدة');
      const qty = parseFloat(card.querySelector('#new-qty').value) || 0;
      adminAddNewItem({ name, trackType:type, unitLabel, qty, lowStock: low });
    }
  };

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = `<h2>${t('currentItems')}</h2>`;
  state.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<div class="item-name">${itemName(item)}</div>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = t('delete');
    delBtn.style.color = 'var(--danger)';
    delBtn.onclick = ()=>{ if(confirm(`${t('delete')} ${itemName(item)}?`)) adminDeleteItem(item.id); };
    row.appendChild(delBtn);
    listCard.appendChild(row);
  });
  container.appendChild(listCard);
}

function AdminTabSettings(container){
  const passCard = document.createElement('div');
  passCard.className = 'card';
  passCard.innerHTML = `
    <h2>${t('adminNameLabel')}</h2>
    <input type="text" id="new-admin-name" placeholder="${t('adminNameLabel')}" value="${state.adminName||''}">
    <button class="btn-primary" id="change-name-btn" style="margin-bottom:16px;">${t('save')}</button>
    <div class="divider"></div>
    <h2>${t('changeAdminPass')}</h2>
    <input type="password" id="new-admin-pass" placeholder="${t('newPasswordPlaceholder')}">
    <button class="btn-primary" id="change-pass-btn">${t('save')}</button>
  `;
  container.appendChild(passCard);
  passCard.querySelector('#change-name-btn').onclick = ()=>{
    const v = passCard.querySelector('#new-admin-name').value.trim();
    if(v) adminChangeName(v);
  };
  passCard.querySelector('#change-pass-btn').onclick = ()=>{
    const v = passCard.querySelector('#new-admin-pass').value;
    if(v && v.length>=4) adminChangePassword(v);
    else { state.message={type:'error',text:t('passwordTooShort')}; render(); }
  };

  const usersCard = document.createElement('div');
  usersCard.className = 'card';
  usersCard.innerHTML = `<h2>${t('cookAccounts')}</h2>`;
  state.cookUsers.forEach(u=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<div class="item-name">${u.username}</div>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = t('delete');
    delBtn.style.color = 'var(--danger)';
    delBtn.onclick = ()=>{ if(confirm(`${t('delete')} ${u.username}?`)) adminDeleteCookUser(u.username); };
    row.appendChild(delBtn);
    usersCard.appendChild(row);
  });
  usersCard.innerHTML += `
    <div class="divider"></div>
    <label>${t('newCookUsername')}</label>
    <input type="text" id="new-cook-user" placeholder="${t('newCookUsernamePlaceholder')}">
    <label>${t('simplePassword')}</label>
    <input type="text" id="new-cook-pass" placeholder="${t('simplePassword')}">
    <button class="btn-primary" id="add-cook-btn">${t('addAccount')}</button>
  `;
  container.appendChild(usersCard);
  usersCard.querySelector('#add-cook-btn').onclick = ()=>{
    const u = usersCard.querySelector('#new-cook-user').value.trim();
    const p = usersCard.querySelector('#new-cook-pass').value.trim();
    if(u && p) adminAddCookUser(u, p);
  };

  const notifyCard = document.createElement('div');
  notifyCard.className = 'card';
  notifyCard.innerHTML = `
    <h2>${t('sendSettings')}</h2>
    <label>${t('defaultWhatsapp')}</label>
    <input type="text" id="notify-wa" placeholder="971500888917" value="${state.notify.whatsapp||''}">
    <label>${t('defaultEmail')}</label>
    <input type="email" id="notify-email" placeholder="example@email.com" value="${state.notify.email||''}">
    <button class="btn-primary" id="save-notify-btn">${t('saveSendSettings')}</button>
  `;
  container.appendChild(notifyCard);
  notifyCard.querySelector('#save-notify-btn').onclick = async ()=>{
    state.notify = {
      whatsapp: notifyCard.querySelector('#notify-wa').value.trim(),
      email: notifyCard.querySelector('#notify-email').value.trim()
    };
    await settingsSet('notify', state.notify);
    state.message = { type:'success', text:t('sendSettingsSaved') };
    render();
  };

  const noteCard = document.createElement('div');
  noteCard.className = 'card';
  noteCard.innerHTML = `<p class="fine">${t('securityNote')}</p>`;
  container.appendChild(noteCard);
}

// ---------- MAIN RENDER ----------
function App(){
  const container = document.getElementById('app');
  container.dataset.rendered = '1';
  if(state.loading){
    container.innerHTML = `<div class="center-screen"><p class="sub">${t('loading')}</p></div>`;
    return;
  }
  if(state.screen==='role-select') ScreenRoleSelect(container);
  else if(state.screen==='admin-login') ScreenAdminLogin(container);
  else if(state.screen==='cook-login') ScreenCookLogin(container);
  else if(state.screen==='admin') ScreenAdmin(container);
  else if(state.screen==='cook') ScreenCook(container);
}

init();
</script>
</body>
</html>
