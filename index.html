<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>كشف مخزون تنورك</title>
<style>
  :root{
    --line:#000;
    --bg:#ffffff;
    --text:#000000;
    --muted:#555555;
    --accent:#000000;
    --danger:#b00000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:900px;margin:0 auto;padding:16px 14px 60px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:800;text-align:center;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px;text-align:center;}
  .top-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;justify-content:center;}
  .top-row label{font-weight:700;font-size:14px;}
  .top-row input{
    border:2px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;
    font-family:inherit;background:#fff;color:#000;
  }
  .section{border:2px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden;}
  .section-header{
    display:flex;align-items:center;gap:8px;background:#000;color:#fff;padding:10px 12px;
  }
  .section-header input{
    flex:1;background:transparent;border:none;color:#fff;font-size:17px;font-weight:800;
    font-family:inherit;padding:4px;
  }
  .section-header input::placeholder{color:#ccc;}
  .icon-btn{
    background:#fff;color:#000;border:1.5px solid #fff;border-radius:6px;
    padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700;
  }
  .icon-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
  table{width:100%;border-collapse:collapse;}
  thead th{
    border:1.5px solid var(--line);padding:8px 6px;font-size:13px;background:#eee;font-weight:800;
    text-align:center;
  }
  tbody td{
    border:1.5px solid var(--line);padding:6px;text-align:center;vertical-align:middle;
  }
  tbody td input, tbody td select{
    width:100%;border:1px solid #999;border-radius:4px;padding:6px 4px;font-size:13.5px;
    font-family:inherit;text-align:center;background:#fff;color:#000;
  }
  tbody td input[type="text"].name-input{text-align:right;}
  .row-actions{white-space:nowrap;}
  .row-actions button{
    background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:4px 8px;
    font-size:12px;cursor:pointer;margin:0 2px;font-family:inherit;
  }
  .row-actions button.danger{color:var(--danger);border-color:var(--danger);}
  .add-item-row td{padding:8px;background:#fafafa;}
  .add-item-row button{
    width:100%;padding:9px;border:1.5px dashed var(--line);background:#fff;border-radius:6px;
    font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .actions-bar{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0;
  }
  button.big{
    padding:13px 18px;border-radius:10px;border:2px solid var(--line);font-size:14.5px;
    font-weight:800;cursor:pointer;font-family:inherit;background:#fff;color:#000;
  }
  button.big.primary{background:#000;color:#fff;}
  button.big.whatsapp{background:#25D366;color:#fff;border-color:#25D366;}
  .add-section-btn{
    width:100%;padding:14px;border:2px dashed var(--line);border-radius:10px;background:#fff;
    font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:18px;
  }
  .msg{font-size:13.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;text-align:center;font-weight:700;}
  .msg-success{background:#eaffea;border:1.5px solid #2a8a2a;color:#186818;}
  .msg-error{background:#ffeaea;border:1.5px solid #b00000;color:#900000;}
  .empty-note{padding:14px;text-align:center;color:var(--muted);font-size:13px;}
  @media print{
    .no-print{display:none !important;}
    .section{break-inside:avoid;}
    body{padding:0;}
  }
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:40px 0;">جارِ التحميل...</div></div>

<script>
function showFatalError(msg){
  var app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div style="padding:20px;color:#900;font-family:sans-serif;direction:ltr;text-align:left;">'+
      '<h2 style="color:#b00;">Loading error</h2>'+
      '<p style="font-size:13px;word-break:break-word;">'+ msg +'</p>'+
      '<p style="font-size:12px;color:#555;">Please check your internet connection and reload the page.</p>'+
    '</div>';
  }
}
window.addEventListener('error', function(e){ showFatalError(e.message || 'Unknown error'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
const SUPABASE_URL = 'https://iekotptltmkjmieauhqc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN';
let supabase;
try{
  if(!window.supabase) throw new Error('Supabase library object not found on window after script load');
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(err){
  showFatalError('Supabase init failed: ' + (err && err.message ? err.message : err));
  throw err;
}

const SHEET_KEY = 'stock_sheet';

async function settingsGet(key){
  try{
    const { data, error } = await supabase.from('settings').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function settingsSet(key, value){
  try{
    await supabase.from('settings').upsert({ key, value });
    return true;
  }catch(e){ return false; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function nowTimeLabel(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())} - ${todayStr()}`;
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}

function seedDefault(){
  return {
    chef: '',
    sections: [
      {
        id: uid(),
        title: 'مخزن المطعم - الصالة',
        items: [
          { id: uid(), name: 'لحم غنم', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
          { id: uid(), name: 'دجاج كامل', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
          { id: uid(), name: 'دجاج مقطع', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
          { id: uid(), name: 'زيت', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
          { id: uid(), name: 'رز', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
          { id: uid(), name: 'هيل', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'كمون', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'بابريكا', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'كزبرة ناشفة', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'فلفل أسود', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'بهارات مشكلة', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'قرفة', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'زعفران', qty: 0, unit: 'غرام', remaining: 0, date: todayStr() },
          { id: uid(), name: 'ملح', qty: 0, unit: 'كيلو', remaining: 0, date: todayStr() },
        ]
      }
    ]
  };
}

let state = { chef:'', sections:[], loading:true, message:null };

async function init(){
  let sheet = await settingsGet(SHEET_KEY);
  if(!sheet){
    sheet = seedDefault();
    await settingsSet(SHEET_KEY, sheet);
  }
  state.chef = sheet.chef || '';
  state.sections = sheet.sections || [];
  state.loading = false;
  render();
}

async function logSnapshot(){
  const timeLabel = nowTimeLabel();
  const rawDate = todayISO();
  const chef = state.chef || '-';
  const rows = [];
  state.sections.forEach(section=>{
    section.items.forEach(item=>{
      rows.push({
        id: uid(),
        item_id: item.id,
        item_name: item.name || '(بدون اسم)',
        item_name_en: section.title,
        type: 'stock_sheet',
        qty: item.qty,
        unit: item.unit,
        unit_num: item.remaining,
        user_name: chef,
        time_label: timeLabel,
        raw_date: rawDate
      });
    });
  });
  if(rows.length === 0) return;
  try{ await supabase.from('logs').insert(rows); }catch(e){}
}

async function saveSheet(showMsg){
  const payload = { chef: state.chef, sections: state.sections };
  const ok = await settingsSet(SHEET_KEY, payload);
  if(ok) await logSnapshot();
  if(showMsg){
    state.message = ok ? { type:'success', text:'تم الحفظ بنجاح' } : { type:'error', text:'حدث خطأ أثناء الحفظ' };
    render();
    setTimeout(()=>{ state.message = null; render(); }, 2500);
  }
}

let historyOpen = false;
let historyData = null;
let historyLoading = false;

async function loadHistory(){
  historyLoading = true;
  render();
  try{
    const { data, error } = await supabase.from('logs').select('*').eq('type','stock_sheet').order('created_at', { ascending:false }).limit(1000);
    historyData = (!error && data) ? data : [];
  }catch(e){ historyData = []; }
  historyLoading = false;
  render();
}

function groupHistory(rows){
  const groups = {};
  const order = [];
  rows.forEach(row=>{
    const key = row.time_label + '|' + row.user_name;
    if(!groups[key]){ groups[key] = { time_label: row.time_label, user_name: row.user_name, items: [] }; order.push(key); }
    groups[key].items.push(row);
  });
  return order.map(k=>groups[k]);
}

function addSection(){
  state.sections.push({ id: uid(), title: 'قسم جديد', items: [] });
  render();
}
function removeSection(sectionId){
  if(!confirm('حذف هذا القسم بالكامل؟')) return;
  state.sections = state.sections.filter(s => s.id !== sectionId);
  render();
}
function addItem(sectionId){
  const section = state.sections.find(s => s.id === sectionId);
  if(!section) return;
  section.items.push({ id: uid(), name:'', qty:0, unit:'كيلو', remaining:0, date: todayStr() });
  render();
}
function removeItem(sectionId, itemId){
  const section = state.sections.find(s => s.id === sectionId);
  if(!section) return;
  section.items = section.items.filter(i => i.id !== itemId);
  render();
}

function buildWhatsappText(){
  const lines = [];
  lines.push('كشف مخزون تنورك');
  lines.push('التاريخ: ' + todayStr());
  if(state.chef) lines.push('الشيف: ' + state.chef);
  lines.push('');
  state.sections.forEach(section=>{
    lines.push('== ' + section.title + ' ==');
    if(section.items.length === 0){
      lines.push('(لا توجد أصناف)');
    } else {
      section.items.forEach(item=>{
        lines.push(`- ${item.name || '(بدون اسم)'} | الكمية: ${item.qty} ${item.unit} | المتبقي: ${item.remaining} ${item.unit} | ${item.date}`);
      });
    }
    lines.push('');
  });
  return lines.join('\n');
}

function sendWhatsapp(){
  const text = buildWhatsappText();
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function el(html){ const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

function messageBox(){
  if(!state.message) return '';
  const cls = state.message.type === 'error' ? 'msg-error' : 'msg-success';
  return `<div class="msg ${cls}">${state.message.text}</div>`;
}

function App(){
  const app = document.getElementById('app');
  app.dataset.rendered = '1';
  if(state.loading){
    app.innerHTML = '<div style="text-align:center;padding:40px 0;">جارِ التحميل...</div>';
    return;
  }
  app.innerHTML = `
    <h1>كشف مخزون تنورك</h1>
    <p class="sub">تاريخ اليوم: ${todayStr()}</p>
    ${messageBox()}
    <div class="top-row no-print">
      <label>اسم الشيف:</label>
      <input type="text" id="chef-input" placeholder="اكتب اسم الشيف" value="${state.chef.replace(/"/g,'&quot;')}">
    </div>
    <div class="top-row" style="display:none;" id="print-chef-row"></div>
    <div id="sections-holder"></div>
    <button class="add-section-btn no-print" id="add-section-btn">+ إضافة قسم جديد</button>
    <div class="actions-bar no-print">
      <button class="big primary" id="save-btn">حفظ التعديلات</button>
      <button class="big whatsapp" id="wa-btn">📲 إرسال واتساب</button>
      <button class="big" id="print-btn">🖨️ طباعة</button>
      <button class="big" id="history-btn">📜 السجل التاريخي</button>
    </div>
    <div id="history-panel"></div>
  `;

  document.getElementById('chef-input').oninput = (e)=>{ state.chef = e.target.value; };
  document.getElementById('add-section-btn').onclick = addSection;
  document.getElementById('save-btn').onclick = ()=> saveSheet(true);
  document.getElementById('wa-btn').onclick = sendWhatsapp;
  document.getElementById('print-btn').onclick = ()=> window.print();
  document.getElementById('history-btn').onclick = ()=>{
    historyOpen = !historyOpen;
    if(historyOpen && historyData === null) loadHistory();
    else render();
  };

  const historyPanel = document.getElementById('history-panel');
  if(historyOpen){
    historyPanel.className = 'no-print';
    historyPanel.style.marginTop = '18px';
    if(historyLoading){
      historyPanel.innerHTML = '<div style="text-align:center;padding:20px;">جارِ تحميل السجل...</div>';
    } else {
      const groups = groupHistory(historyData || []);
      if(groups.length === 0){
        historyPanel.innerHTML = '<div class="empty-note">لا يوجد سجل محفوظ بعد</div>';
      } else {
        historyPanel.innerHTML = groups.map(g=>{
          const rowsHtml = g.items.map(it=>`
            <tr>
              <td>${it.item_name}</td>
              <td>${it.item_name_en || ''}</td>
              <td>${it.qty} ${it.unit}</td>
              <td>${it.unit_num} ${it.unit}</td>
            </tr>
          `).join('');
          return `
            <div class="section" style="margin-bottom:16px;">
              <div class="section-header" style="background:#333;">
                <span style="flex:1;font-size:14px;font-weight:800;">🕒 ${g.time_label} — الشيف: ${g.user_name}</span>
              </div>
              <table>
                <thead><tr><th>الصنف</th><th>القسم</th><th>الكمية وقتها</th><th>المتبقي وقتها</th></tr></thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          `;
        }).join('');
      }
    }
  } else {
    historyPanel.innerHTML = '';
  }

  const holder = document.getElementById('sections-holder');
  if(state.chef){
    const printChefRow = document.getElementById('print-chef-row');
    printChefRow.style.display = 'block';
    printChefRow.innerHTML = `<strong>الشيف:</strong> ${state.chef}`;
  }

  state.sections.forEach(section=>{
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <input type="text" class="section-title-input no-print" data-id="${section.id}" value="${section.title.replace(/"/g,'&quot;')}" placeholder="عنوان القسم">
        <span class="section-title-print" style="display:none;flex:1;font-size:17px;font-weight:800;">${section.title}</span>
        <button class="icon-btn danger no-print" data-remove-section="${section.id}">حذف القسم</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>الصنف</th>
            <th>الكمية</th>
            <th>الوحدة</th>
            <th>المتبقي بالمخزن</th>
            <th>التاريخ</th>
            <th class="no-print">إجراء</th>
          </tr>
        </thead>
        <tbody data-items-body="${section.id}"></tbody>
      </table>
      <table class="no-print"><tbody>
        <tr class="add-item-row"><td colspan="6"><button data-add-item="${section.id}">+ إضافة صنف</button></td></tr>
      </tbody></table>
    `;
    holder.appendChild(sec);

    const tbody = sec.querySelector(`[data-items-body="${section.id}"]`);
    if(section.items.length === 0){
      tbody.innerHTML = `<tr><td colspan="6" class="empty-note">لا توجد أصناف بعد</td></tr>`;
    } else {
      section.items.forEach(item=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" class="name-input" data-field="name" value="${(item.name||'').replace(/"/g,'&quot;')}" placeholder="اسم الصنف"></td>
          <td><input type="number" step="any" data-field="qty" value="${item.qty}"></td>
          <td>
            <select data-field="unit">
              <option value="كيلو" ${item.unit==='كيلو'?'selected':''}>كيلو</option>
              <option value="غرام" ${item.unit==='غرام'?'selected':''}>غرام</option>
              <option value="عدد" ${item.unit==='عدد'?'selected':''}>عدد</option>
              <option value="لتر" ${item.unit==='لتر'?'selected':''}>لتر</option>
            </select>
          </td>
          <td><input type="number" step="any" data-field="remaining" value="${item.remaining}"></td>
          <td><input type="text" data-field="date" value="${item.date}"></td>
          <td class="row-actions no-print"><button class="danger" data-remove-item="${section.id}|${item.id}">حذف</button></td>
        `;
        tbody.appendChild(tr);
        tr.querySelectorAll('[data-field]').forEach(inputEl=>{
          inputEl.oninput = ()=>{
            const field = inputEl.dataset.field;
            let val = inputEl.value;
            if(field==='qty' || field==='remaining') val = parseFloat(val) || 0;
            item[field] = val;
          };
        });
      });
    }
  });

  holder.querySelectorAll('.section-title-input').forEach(inputEl=>{
    inputEl.oninput = ()=>{
      const section = state.sections.find(s=>s.id===inputEl.dataset.id);
      if(section) section.title = inputEl.value;
      const printSpan = inputEl.parentElement.querySelector('.section-title-print');
      if(printSpan) printSpan.textContent = inputEl.value;
    };
  });
  holder.querySelectorAll('[data-remove-section]').forEach(btn=>{
    btn.onclick = ()=> removeSection(btn.dataset.removeSection);
  });
  holder.querySelectorAll('[data-add-item]').forEach(btn=>{
    btn.onclick = ()=> addItem(btn.dataset.addItem);
  });
  holder.querySelectorAll('[data-remove-item]').forEach(btn=>{
    btn.onclick = ()=>{
      const [sectionId, itemId] = btn.dataset.removeItem.split('|');
      removeItem(sectionId, itemId);
    };
  });
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>
